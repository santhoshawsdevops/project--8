apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-monitoring-demo
  namespace: monitoring-demo
spec:
  replicas: 2
  selector:
      matchLabels:
       app: nginx
  template:
      metadata:
        labels: 
          app: nginx 
      spec:
        containers:
        - name: nginx-containers
          image: nginx:latest
          ports:
          - containerPort: 80      
